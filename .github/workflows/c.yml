name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM
      run: sudo rm -rf /var/lib/apt/lists/* && sudo apt clean && sudo apt update && sudo apt install llvm
    - name: test
      run: make test
